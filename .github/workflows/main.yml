
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build -t welcome-backend:latest .

      - name: Tag Docker Image
        run: |
          docker tag welcome-backend:latest \
            chatbotveersa-afageydwc9a7bqbe.azurecr.io/welcome-backend:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription b8b711d8-ae79-422d-8b49-936f9422333a

      - name: Verify ACR
        run: |
          az acr show \
            --name chatbotveersa \
            --resource-group rg-poc-demo \
            --query loginServer \
            --output tsv

      - name: Login to ACR
        run: az acr login --name chatbotveersa

      - name: Push Image to ACR
        run: |
          docker push \
            chatbotveersa-afageydwc9a7bqbe.azurecr.io/welcome-backend:latest

      - name: Verify Pushed Image
        run: |
          az acr repository show-tags \
            --name chatbotveersa \
            --resource-group rg-poc-demo \
            --repository welcome-backend \
            --output table

      - name: Azure Logout
        if: always()
        run: az logout || true
