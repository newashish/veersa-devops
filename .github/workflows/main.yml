
name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t welcome-backend:latest .

      - name: Tag Docker Image for ACR
        run: docker tag welcome-backend:latest chatbotveersa-afageydwc9a7bqbe.azurecr.io/welcome-backend:latest
